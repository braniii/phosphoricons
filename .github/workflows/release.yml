name: Release to CTAN

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the upload instead of submitting it"
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation and CTAN archive
        run: |
          scripts/build_doc.sh
          scripts/build_ctan.sh

      - name: Read package version
        id: version
        run: |
          V=$(sed -nE 's/.*ProvidesExplPackage\{phosphoricons\}\{[^}]*\}\{([0-9.-]+)\}.*/\1/p' \
              phosphoricons/tex/phosphoricons.sty)
          echo "pkgversion=$V" >> "$GITHUB_OUTPUT"

      - name: Submit to CTAN
        env:
          ACTION: ${{ inputs.dry_run && 'validate' || 'upload' }}
          VERSION: ${{ steps.version.outputs.pkgversion }}
          CTAN_EMAIL: ${{ secrets.CTAN_EMAIL }}
        run: |
          code=$(curl -sS -o response.json -w '%{http_code}' \
              -F update=true -F pkg=phosphoricons -F version="$VERSION" \
              -F uploader="Daniel Nagel" -F email="$CTAN_EMAIL" \
              -F license=lppl1.3c -F license=mit \
              -F file=@build/ctan/phosphoricons.zip "https://www.ctan.org/submit/$ACTION")
          echo "CTAN responded with $code:"
          cat response.json; echo
          [ "$code" = 200 ] && ! grep -qE '"ERROR"|Upload failed' response.json
